services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-minimal_thread}
      POSTGRES_USER: ${DB_USER:-thread_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-thread_local_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - thread_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  thread_pgdata:
